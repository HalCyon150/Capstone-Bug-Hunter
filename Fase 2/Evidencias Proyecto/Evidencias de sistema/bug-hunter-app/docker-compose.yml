services:
  postgres:
    image: postgres:16-alpine
    container_name: bughunter-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-bughunter}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: